[project]
name = "ai-toolkit-components"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docker>=7.1.0",
    "pytest>=9.0.3",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "beautifulsoup4>=4.12.0",
    "lxml>=6.1.0",
    "numpy>=1.26.0",
    "mcp>=1.0.0",
    "pandas>=2.0",
    "seqeval>=1.2.2",
]

[dependency-groups]
dev = [
    # Upper bound is a safe-chain workaround: 4.6.0 is blocked by minimum package age.
    # Remove the upper bound once 4.6.0 has aged through safe-chain.
    "pre-commit>=3.0.0,<4.6.0",
]
