services:
  vector_db:
    build:
      context: .
      dockerfile: components/vector_db/Dockerfile
    image: vector_db:latest
    restart: unless-stopped
    ports:
      - "${VECTOR_DB_HTTP_PORT:-6333}:${VECTOR_DB_HTTP_PORT:-6333}"
      - "${VECTOR_DB_GRPC_PORT:-6334}:${VECTOR_DB_GRPC_PORT:-6334}"
    volumes:
      - ./data/vector_db:/qdrant/storage
    environment:
      - VECTOR_DB_BIND_HOST=${VECTOR_DB_BIND_HOST:-0.0.0.0}
      - VECTOR_DB_HTTP_PORT=${VECTOR_DB_HTTP_PORT:-6333}
      - VECTOR_DB_GRPC_PORT=${VECTOR_DB_GRPC_PORT:-6334}

  data_ingestor:
    build:
      context: .
      dockerfile: components/data_ingestor/Dockerfile
    image: data_ingestor:latest
    depends_on:
      - vector_db
    restart: unless-stopped
    environment:
      - VECTOR_DB_HOST=vector_db
      - VECTOR_DB_PORT=${VECTOR_DB_HTTP_PORT:-6333}

  mcp_server:
    build:
      context: .
      dockerfile: components/mcp_server/Dockerfile
    image: mcp_server:latest
    restart: unless-stopped
    ports:
      - "${MCP_SERVER_PORT:-8080}:${MCP_SERVER_PORT:-8080}"
    depends_on:
      - vector_db
    environment:
      - MCP_SERVER_HOST=${MCP_SERVER_HOST:-0.0.0.0}
      - MCP_SERVER_PORT=${MCP_SERVER_PORT:-8080}
      - VECTOR_DB_HOST=vector_db
      - VECTOR_DB_PORT=${VECTOR_DB_HTTP_PORT:-6333}

  vector_query:
    build:
      context: .
      dockerfile: components/vector_query/Dockerfile
    image: vector_query:latest
    depends_on:
      - vector_db
    restart: unless-stopped
    environment:
      - VECTOR_DB_HOST=vector_db
      - VECTOR_DB_PORT=${VECTOR_DB_HTTP_PORT:-6333}

  pii_cleanse:
    build:
      context: components/pii_cleanse
    image: pii_cleanse:latest
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - SENSITIVE_CONFIG=/app/configs/sensitive_attr_config.json

  pii_eval:
    build:
      context: components/pii_eval
    image: pii_eval:latest
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}

  data_extractor:
    build:
      context: components/data_extractor
    image: data_extractor:latest
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - EXTRACT_CONFIG=/app/configs/extracta_config.json
