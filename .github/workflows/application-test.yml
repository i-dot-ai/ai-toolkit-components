name: Test Applications

on:
    workflow_run:
        workflows: ["Publish Latest Images"]
        types: [completed]
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
  contents: read

jobs:
  wait-for-components:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Guard against untrusted workflow_run sources
        if: github.event_name == 'workflow_run'
        env:
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "Triggered from fork '$HEAD_REPO' — aborting to prevent privilege escalation."
            exit 1
          fi

      - name: Fail if publish did not succeed
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
        run: |
          echo "Publish workflow did not succeed (conclusion: ${{ github.event.workflow_run.conclusion }}), skipping application tests."
          exit 1

      - name: Wait for component build and test to succeed
        if: github.event_name == 'pull_request'
        uses: lewagon/wait-on-check-action@ccfb013c15c8afb7bf2b7c028fb74dc5a068cccc # v1.3.4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-regexp: 'build-and-test'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

  discover:
    needs: wait-for-components
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      applications: ${{ steps.find.outputs.applications }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find applications
        id: find
        run: |
          applications=$(ls -d applications/*/ | xargs -n1 basename | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "applications=$applications" >> $GITHUB_OUTPUT

  test:
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        application: ${{ fromJson(needs.discover.outputs.applications) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          python-version-file: .python-version

      - name: Sync dependencies
        run: uv sync

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Test application
        env:
          APPS_USE_REGISTRY_IMAGES: ${{ github.ref == 'refs/heads/main' && 'true' || '' }}
        run: |
          mkdir -p results
          ./run_tests.sh application ${{ matrix.application }} -- \
            --junitxml="results/application-${{ matrix.application }}.xml"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.application }}
          path: results/application-${{ matrix.application }}.xml

  publish-results:
    needs: [discover, test]
    runs-on: ubuntu-latest
    if: ${{ needs.test.result != 'skipped' }}
    permissions:
      contents: read
      checks: write          # Required to create check runs for test results
      pull-requests: write   # Required to write back to PR
    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          merge-multiple: true
          path: results

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@c950f6fb443cb5af20a377fd0dfaa78838901040 # v2
        with:
          files: results/application-*.xml
          check_name: Application Test Results
